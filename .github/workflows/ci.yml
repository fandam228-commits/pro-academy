name: CI — Type Check & Build

on:
  push:
    branches: [main, master]
  # Run the full verification suite for stacked PRs targeting feature branches too.
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Tests, type check, lint, and production build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: proacademy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d proacademy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: PostgreSQL-backed Analytics authorization integration tests
        run: |
          if [ -z "${TEST_DATABASE_URL:-}" ]; then
            echo "::error::TEST_DATABASE_URL is required; Analytics integration tests must not silently skip in CI."
            exit 1
          fi
          node --test tests/integration/analytics-authorization.integration.mjs
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/proacademy_test
      - name: TypeScript check
        run: npm run typecheck
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/placeholder
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/placeholder
          NODE_ENV: production
