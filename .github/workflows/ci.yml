name: CI — Type Check & Build

on:
  push:
    branches: [main, master]
  pull_request: {}
  workflow_dispatch:

jobs:
  verify:
    name: Type check and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: TypeScript check
        run: npm run typecheck
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/placeholder
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/placeholder
          NODE_ENV: production
