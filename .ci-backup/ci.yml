name: CI — Build & Type Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Type check & production build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Next.js route types
        run: npx next typegen
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/placeholder

      - name: TypeScript check
        run: npx tsc --noEmit --pretty false
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/placeholder

      - name: Production build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/placeholder
          NODE_ENV: production
